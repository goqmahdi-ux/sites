<style>
:root{--bg:#F4F2F1;--ink:#1A1216;--mute:#6F6469;--primary:#630A36;--free:#1F9D5F;--taken:#D63A3A;--line:#E9E4E1}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,-apple-system,sans-serif}
.wrap{max-width:440px;margin:0 auto;padding:28px 18px 40px;min-height:100vh;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.brand img{width:52px;height:52px;border-radius:14px}
.brand b{display:block;font-size:15px}.brand span{font-size:13px;color:var(--mute)}
.card{background:#fff;border-radius:22px;padding:22px 20px;box-shadow:0 10px 30px rgba(99,10,54,.08);border:1px solid var(--line)}
h1{margin:0 0 6px;font-size:24px;color:var(--primary)}
.lead{margin:0 0 18px;color:var(--mute);font-size:15px;line-height:1.7}
label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
input{width:100%;font:inherit;font-size:22px;letter-spacing:.06em;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:#FAF8F7;direction:ltr;text-align:center;outline:none}
input:focus{border-color:var(--primary);background:#fff}
button{width:100%;font:inherit;font-size:18px;font-weight:700;padding:15px;border-radius:14px;border:0;background:var(--primary);color:#fff;cursor:pointer;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:10px}
button:disabled{opacity:.6;cursor:default}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #c9a45c;outline-offset:2px}
.msg{margin-top:16px;border-radius:16px;padding:16px;font-size:15.5px;line-height:1.75;display:none}
.msg.on{display:block}.msg.ok{background:#E6F5EC;color:#14532d}.msg.bad{background:#FDECEC;color:#7f1d1d}.msg.info{background:#F6EEF2;color:#4a1030}
.msg b{display:block;font-size:20px;margin-bottom:4px}
.msg a{display:block;text-align:center;margin-top:12px;padding:12px;border-radius:12px;background:var(--primary);color:#fff;text-decoration:none;font-weight:700}
.note{margin-top:18px;font-size:13px;color:var(--mute);line-height:1.7;text-align:center}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite;display:none}
.busy .spin{display:inline-block}@keyframes s{to{transform:rotate(360deg)}}
.check{width:64px;height:64px;border-radius:50%;background:var(--free);color:#fff;display:grid;place-items:center;margin:0 auto 10px;font-size:34px}
.steps{margin:10px 0 0;padding-inline-start:20px;text-align:start;line-height:1.9}.steps li{margin:4px 0}.msg .steps b{display:inline;font-size:inherit;margin:0}
</style>
</head>

  <section class="card" aria-labelledby="h">
    <h1 id="h">تسجيل دخول منظم</h1>
    <p class="lead">سجّل حضورك عند وصولك إلى الجامعة. يجب أن تكون داخل حرم الجامعة وأن تسمح للمتصفح بالوصول إلى موقعك.</p>
    <form id="f" novalidate>
      <label for="ph">رقم الهاتف المسجّل لدى اللجنة</label>
      <input id="ph" type="tel" inputmode="numeric" autocomplete="tel" maxlength="16" placeholder="07xxxxxxxxx" required>
      <button id="go" type="submit"><span class="spin" aria-hidden="true"></span><span id="goT">تسجيل الحضور</span></button>
    </form>
    <div class="msg" id="m" role="status" aria-live="polite"></div>
  </section>
  <p class="note">العروش للفعاليات · يُسجَّل حضورك مرة واحدة في اليوم، ويظهر مباشرة لدى إدارة المؤتمر.</p>
</main>
<script>
(()=>{
const $=s=>document.querySelector(s),api=r=>'../api.php?r='+r;
const ph=$('#ph'),m=$('#m'),go=$('#go'),goT=$('#goT');
try{const v=localStorage.getItem('org-ph');if(v)ph.value=v}catch(e){}
fetch(api('session'),{cache:'no-store'}).then(r=>r.json()).then(j=>{if(j&&j.title)$('#evT').textContent=j.title}).catch(()=>{});
const show=(cls,html)=>{m.className='msg on '+cls;m.innerHTML=html};
const busy=(on,t)=>{go.disabled=on;go.classList.toggle('busy',on);goT.textContent=t||'تسجيل الحضور'};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tm=t=>new Date(t).toLocaleTimeString('ar-IQ',{hour:'numeric',minute:'2-digit'});
$('#f').addEventListener('submit',e=>{
  e.preventDefault();
  const v=ph.value.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g,'');
  if(v.length<10){show('bad','اكتب رقم هاتفك كاملاً، مثل 07701234567');ph.focus();return}
  try{localStorage.setItem('org-ph',v)}catch(e){}
  if(!navigator.geolocation){show('bad','هذا المتصفح لا يدعم تحديد الموقع. افتح الرابط من متصفح Chrome أو Safari.');return}
  busy(true,'جارٍ تحديد موقعك…');show('info','يرجى السماح للمتصفح بالوصول إلى موقعك عند ظهور الطلب.');
  navigator.geolocation.getCurrentPosition(async p=>{
    busy(true,'جارٍ تسجيل الحضور…');
    try{
      const r=await fetch(api('org-checkin'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ph:v,lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy})});
      let j={};try{j=await r.json()}catch(e){}
      if(r.ok&&j.ok){
        show('ok',`<div class="check" aria-hidden="true">✓</div><b>أهلاً ${esc(j.name)}</b>${j.already?'حضورك مسجّل مسبقاً اليوم الساعة '+tm(j.t)+'.':'تم تسجيل حضورك اليوم الساعة '+tm(j.t)+'. شكراً لالتزامك.'}${j.access?'<a href="../">الدخول إلى نظام الاستقبال برمزك</a>':''}`);
      }else show('bad',esc(j.msg||'تعذّر تسجيل الحضور، حاول مرة أخرى.'));
    }catch(err){show('bad','تعذّر الاتصال بالخادم. تأكد من الإنترنت ثم أعد المحاولة.')}
    busy(false);
  },err=>{
    busy(false);
    const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);const st=ios?'<ol class="steps"><li>افتح <b>الإعدادات</b> ← <b>الخصوصية والأمان</b> ← <b>خدمات الموقع</b> وتأكد أنها مفعّلة.</li><li>انزل إلى <b>مواقع Safari</b> (أو اسم المتصفح الذي تستخدمه) واختر <b>أثناء استخدام التطبيق</b>، وفعّل <b>الموقع الدقيق</b>.</li><li>ارجع إلى هذه الصفحة، حدّثها، واضغط تسجيل الحضور مرة أخرى.</li></ol>':'<ol class="steps"><li>فعّل <b>الموقع</b> من الشريط العلوي للهاتف.</li><li>اضغط على رمز القفل بجانب الرابط ← <b>الأذونات</b> ← <b>الموقع</b> ← <b>السماح</b>.</li><li>حدّث الصفحة واضغط تسجيل الحضور مرة أخرى.</li></ol>';show('bad',err.code===1?'<b>الموقع غير مسموح لهذا المتصفح.</b>'+st:'<b>تعذّر تحديد موقعك.</b> تأكد من تفعيل خدمة الموقع، واخرج إلى مكان مفتوح إن أمكن، ثم أعد المحاولة.');
  },{enableHighAccuracy:true,timeout:20000,maximumAge:0});
});
})();
</script>
