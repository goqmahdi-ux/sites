<style>
:root{--bg:#F4F2F1;--ink:#1A1216;--mute:#6F6469;--primary:#630A36;--free:#1F9D5F;--taken:#D63A3A;--line:#E9E4E1}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,-apple-system,sans-serif}
.wrap{max-width:440px;margin:0 auto;padding:28px 18px 40px;min-height:100vh;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.brand img{width:52px;height:52px;border-radius:14px}
.brand b{display:block;font-size:15px}.brand span{font-size:13px;color:var(--mute)}
.card{background:#fff;border-radius:22px;padding:22px 20px;box-shadow:0 10px 30px rgba(99,10,54,.08);border:1px solid var(--line)}
h1{margin:0 0 6px;font-size:24px;color:var(--primary)}
.lead{margin:0 0 18px;color:var(--mute);font-size:15px;line-height:1.7}
label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
input{width:100%;font:inherit;font-size:22px;letter-spacing:.06em;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:#FAF8F7;direction:ltr;text-align:center;outline:none}
input:focus{border-color:var(--primary);background:#fff}
button{width:100%;font:inherit;font-size:18px;font-weight:700;padding:15px;border-radius:14px;border:0;background:var(--primary);color:#fff;cursor:pointer;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:10px}
button:disabled{opacity:.6;cursor:default}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #c9a45c;outline-offset:2px}
.msg{margin-top:16px;border-radius:16px;padding:16px;font-size:15.5px;line-height:1.75;display:none}
.msg.on{display:block}.msg.ok{background:#E6F5EC;color:#14532d}.msg.bad{background:#FDECEC;color:#7f1d1d}.msg.info{background:#F6EEF2;color:#4a1030}
.msg b{display:block;font-size:20px;margin-bottom:4px}
.msg a{display:block;text-align:center;margin-top:12px;padding:12px;border-radius:12px;background:var(--primary);color:#fff;text-decoration:none;font-weight:700}
.note{margin-top:18px;font-size:13px;color:var(--mute);line-height:1.7;text-align:center}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite;display:none}
.busy .spin{display:inline-block}@keyframes s{to{transform:rotate(360deg)}}
.check{width:64px;height:64px;border-radius:50%;background:var(--free);color:#fff;display:grid;place-items:center;margin:0 auto 10px;font-size:34px}
.steps{margin:10px 0 0;padding-inline-start:20px;text-align:start;line-height:1.9}.steps li{margin:4px 0}.msg .steps b{display:inline;font-size:inherit;margin:0}

.fld{margin-bottom:14px}.fld .req{color:#b3261e}
.fld input.t,.fld textarea,.fld select{width:100%;font:inherit;font-size:16px;letter-spacing:0;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:#FAF8F7;direction:rtl;text-align:right;outline:none}
.fld textarea{min-height:84px;resize:vertical}
.fld input.t:focus,.fld textarea:focus{border-color:var(--primary);background:#fff}
.fld input.ltr{direction:ltr;text-align:left}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.seg{display:flex;gap:8px}.seg button,.chips button,.opt{margin:0;width:auto;flex:1;font-size:15px;font-weight:600;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.seg button.on,.chips button.on,.opt.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button{flex:0 1 auto;font-size:14px;padding:9px 12px;border-radius:999px}
.opts{display:grid;gap:10px}.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:right;padding:16px;border-radius:16px}
.opt b{font-size:20px}.opt span{font-size:13.5px;font-weight:500;opacity:.8}
.hint{font-size:12.5px;color:var(--mute);font-weight:500;margin-top:4px}
.sec{font-size:13px;font-weight:700;color:var(--primary);margin:20px 0 10px;padding-top:14px;border-top:1px dashed var(--line)}
#more{display:none}#more.on{display:block}
@media(max-width:380px){.g2{grid-template-columns:1fr}}
</style>
</head>

  <section class="card" aria-labelledby="h">
    <h1 id="h">وقت حضورك</h1>
    <p class="lead">اختر الوقت الذي يناسبك للحضور خلال أيام المؤتمر.</p>
    <form id="f" novalidate>
      <div class="fld"><label for="ph">رقم الهاتف <span class="req">*</span></label><input id="ph" class="t ltr" type="tel" inputmode="numeric" autocomplete="tel" maxlength="16" placeholder="07xxxxxxxxx"></div>
      <div class="fld"><label for="n">الاسم الثلاثي <span class="req">*</span></label><input id="n" class="t" autocomplete="name" maxlength="80"></div>
      <div class="fld"><label>أيّ وقت يناسبك للحضور؟ <span class="req">*</span></label><div class="opts" id="sh"><button type="button" class="opt" data-v="a"><b>12 ظهراً – 6 مساءً</b><span>الوجبة الأولى</span></button><button type="button" class="opt" data-v="b"><b>4 مساءً – 10 ليلاً</b><span>الوجبة الثانية</span></button></div></div>
      <button id="go" type="submit"><span class="spin" aria-hidden="true"></span><span id="goT">إرسال اختياري</span></button>
    </form>
    <div class="msg" id="m" role="status" aria-live="polite"></div>
  </section>
  <p class="note">العروش للفعاليات · يمكنك تغيير اختيارك لاحقاً بإرسال اختيار جديد.</p>
</main>
<script>
(()=>{
const $=s=>document.querySelector(s),api=r=>'../../api.php?r='+r;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const m=$('#m'),go=$('#go'),goT=$('#goT'),goL=goT.textContent;
const show=(cls,html)=>{m.className='msg on '+cls;m.innerHTML=html;m.scrollIntoView({behavior:'smooth',block:'nearest'})};
const busy=on=>{go.disabled=on;go.classList.toggle('busy',on);goT.textContent=on?'جارٍ الإرسال…':goL};
const digits=v=>String(v||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/\D/g,'');
const seg=(id,cb)=>{const el=$(id);el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();el.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));el.dataset.v=b.dataset.v;cb&&cb(b.dataset.v)})};
try{const v=localStorage.getItem('org-ph');if(v)$('#ph').value=v}catch(e){}
fetch(api('session'),{cache:'no-store'}).then(r=>r.json()).then(j=>{if(j&&j.title)$('#evT').textContent=j.title}).catch(()=>{});
async function send(route,body){busy(true);try{const r=await fetch(api(route),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let j={};try{j=await r.json()}catch(e){}return{s:r.status,j}}catch(e){return{s:0,j:{msg:'تعذّر الاتصال بالخادم. تأكد من الإنترنت ثم أعد المحاولة.'}}}finally{busy(false)}}
const SH={a:'12 ظهراً – 6 مساءً',b:'4 مساءً – 10 ليلاً'};

try{const v=localStorage.getItem('org-n');if(v)$('#n').value=v}catch(e){}
const sh=$('#sh');sh.addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b)return;e.preventDefault();sh.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x===b));sh.dataset.v=b.dataset.v});
$('#f').addEventListener('submit',async e=>{e.preventDefault();
  const ph=digits($('#ph').value),n=$('#n').value.trim().replace(/\s+/g,' '),shift=sh.dataset.v||'';
  if(ph.length<10){show('bad','اكتب رقم هاتفك كاملاً، مثل 07701234567');$('#ph').focus();return}
  if(n.split(' ').length<2){show('bad','اكتب اسمك الثلاثي');$('#n').focus();return}
  if(!shift){show('bad','اختر وقت الحضور');return}
  try{localStorage.setItem('org-ph',ph);localStorage.setItem('org-n',n)}catch(x){}
  const {s,j}=await send('org-vote',{ph,n,shift});
  if(s===200&&j.ok){$('#f').style.display='none';show('ok',`<div class="check" aria-hidden="true">✓</div><b>شكراً ${esc(j.name)}</b>${j.again?'تم تحديث اختيارك':'تم تسجيل اختيارك'}: ${SH[j.shift]}.<a href="../info/">أكمل معلوماتك الشخصية</a>`)}
  else show('bad',esc(j.msg||'تعذّر الإرسال، حاول مرة أخرى.'));
});
})();
</script>
</body>
