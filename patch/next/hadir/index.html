<style>
:root{--bg:#F4F2F1;--card:#fff;--line:#E9E4E1;--ink:#1A1216;--ink2:#3D3238;--mute:#6F6469;--p:#630A36;--p6:#4C072A;--p50:#FBF1F5;--p100:#F2DCE6;--peach:#FFA381;--ok:#1F9D5F;--ok50:#E9F6EF;--bad:#D63A3A;--bad50:#FDEEEE}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",-apple-system,"Segoe UI",Tahoma,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.top{background:var(--p);color:#fff;padding:calc(22px + env(safe-area-inset-top)) 20px 64px;text-align:center}
.top img{width:52px;height:52px;border-radius:14px;display:block;margin:0 auto 12px}
.top small{display:block;color:var(--peach);font-size:13px;font-weight:600;letter-spacing:.2px;margin-bottom:6px}
.top h1{font-size:19px;font-weight:700;line-height:1.6;max-width:520px;margin:0 auto}
main{width:100%;max-width:480px;margin:-44px auto 0;padding:0 16px 32px;flex:1}
.card{background:var(--card);border-radius:20px;padding:22px 18px;box-shadow:0 18px 40px -16px rgba(40,10,25,.25),0 2px 6px rgba(40,10,25,.05)}
.card h2{font-size:20px;font-weight:700;margin-bottom:4px}
.card p.sub{color:var(--mute);font-size:14px;line-height:1.8;margin-bottom:18px}
label{display:block;font-size:14px;font-weight:600;color:var(--ink2);margin:14px 0 7px}
label em{font-style:normal;font-weight:400;color:var(--mute);font-size:12.5px}
input{width:100%;font:inherit;font-size:17px;padding:14px 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--p);box-shadow:0 0 0 4px var(--p100)}
input[type=tel]{direction:ltr;text-align:right}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{font:inherit;font-size:16px;font-weight:600;padding:13px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer;transition:all .15s}
.seg button.on{border-color:var(--p);background:var(--p50);color:var(--p)}
.go{width:100%;margin-top:22px;font:inherit;font-size:17px;font-weight:700;padding:16px;border:0;border-radius:16px;background:var(--p);color:#fff;cursor:pointer;transition:background .15s,transform .1s}
.go:active{transform:scale(.99);background:var(--p6)}
.go:disabled{opacity:.6}
.err{display:none;margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--bad50);color:var(--bad);font-size:14px;line-height:1.7}
.err.on{display:block}
.done{display:none;text-align:center;padding:12px 4px 4px}
.done .ic{width:76px;height:76px;border-radius:50%;background:var(--ok50);display:grid;place-items:center;margin:4px auto 16px}
.done .ic svg{width:40px;height:40px;stroke:var(--ok)}
.done h2{font-size:22px;margin-bottom:6px}
.done p{color:var(--mute);font-size:15px;line-height:1.8}
.again{margin-top:20px;font:inherit;font-size:15px;font-weight:600;padding:13px 18px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--p);cursor:pointer;width:100%}
.undo{margin-top:10px;font:inherit;font-size:13.5px;border:0;background:none;color:var(--mute);text-decoration:underline;cursor:pointer}
.card.ok form{display:none}.card.ok .done{display:block}
footer{text-align:center;color:var(--mute);font-size:12px;padding:0 16px calc(18px + env(safe-area-inset-bottom))}
</style>
</head>

<main>
 <div class="card" id="card">
  <form id="f" novalidate>
   <h2>سجّل حضورك</h2>
   <p class="sub">اكتب اسمك حتى ينضاف لقائمة الحاضرين.</p>
   <label for="n">الاسم الثلاثي</label>
   <input id="n" name="n" type="text" autocomplete="name" maxlength="80" placeholder="مثلاً: زينب علي حسن" required>
   <button class="go" id="go" type="submit">سجّل الحضور</button>
   <div class="err" id="err"></div>
  </form>
  <div class="done">
   <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg></div>
   <h2 id="okT">تم تسجيل حضورك</h2>
   <p id="okP">شكراً لحضورك، اسمك صار بقائمة الحاضرين.</p>
   <button class="again" id="again" type="button">تسجيل شخص ثاني</button>
   <button class="undo" id="undo" type="button" hidden>غلطت بالاسم؟ تراجع</button>
  </div>
 </div>
</main>
<footer>العروش للفعاليات</footer>
<script>
(()=>{const $=s=>document.querySelector(s);let gd='',last=null;
fetch('../api.php?r=session',{cache:'no-store'}).then(r=>r.json()).then(j=>{if(j&&j.title){$('#ttl').textContent=j.title}}).catch(()=>{});
const err=m=>{const e=$('#err');e.textContent=m;e.classList.toggle('on',!!m)};
$('#f').onsubmit=async e=>{e.preventDefault();err('');
 const n=$('#n').value.replace(/\s+/g,' ').trim(),ph='',org='';
 if(n.split(' ').length<2){err('اكتب الاسم الثلاثي');$('#n').focus();return}
 const b=$('#go');b.disabled=true;b.textContent='جاري التسجيل…';
 try{const r=await fetch('../api.php?r=att-form',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({n,gd,ph,org})});let j={};try{j=await r.json()}catch{}
  if(r.ok&&j.ok){last=j.id?{id:j.id,k:j.k,n,ph,org}:null;$('#undo').hidden=!last;$('#okT').textContent=j.again?`${j.name}، حضورك مسجّل من قبل`:`تم تسجيل حضور ${j.name}`;$('#okP').textContent=j.again?'اسمك موجود بقائمة الحاضرين.':'شكراً لحضوركم، الاسم صار بقائمة الحاضرين.';$('#card').classList.add('ok');window.scrollTo({top:0,behavior:'smooth'})}
  else err(j.msg||'ما تم التسجيل، حاول مرة ثانية')}
 catch{err('ماكو اتصال بالإنترنت، تأكد وحاول مرة ثانية')}
 b.disabled=false;b.textContent='سجّل الحضور'};
$('#undo').onclick=async()=>{if(!last)return;const b=$('#undo');b.disabled=true;try{const r=await fetch('../api.php?r=att-undo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:last.id,k:last.k})});if(r.ok){const L=last;last=null;$('#card').classList.remove('ok');$('#n').value=L.n;$('#n').focus()}else{b.textContent='ما ينفع التراجع هسه'}}catch{}b.disabled=false};
$('#again').onclick=()=>{$('#f').reset();$('#card').classList.remove('ok');$('#n').focus()};
})();
</script>
