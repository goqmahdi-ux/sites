<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F2F1;--line:#E9E4E1;--ink:#1A1216;--mute:#6F6469;--p:#630A36;--p50:#FBF1F5;--ok:#1F9D5F}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",-apple-system,"Segoe UI",Tahoma,sans-serif;padding:18px 14px 40px}
.wrap{max-width:900px;margin:0 auto}
h1{font-size:22px;display:flex;align-items:center;gap:10px}
h1 b{background:var(--p);color:#fff;border-radius:999px;font-size:15px;padding:2px 12px}
.sub{color:var(--mute);font-size:13.5px;margin:6px 0 14px;line-height:1.8}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.bar input{flex:1;min-width:200px;font:inherit;font-size:15px;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.btn{font:inherit;font-size:14px;font-weight:600;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--p);cursor:pointer;white-space:nowrap}
.btn.pr{background:var(--p);color:#fff;border-color:var(--p)}
.stats{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.stats span{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13.5px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
th,td{padding:10px 12px;text-align:right;font-size:14px;border-bottom:1px solid var(--line)}
th{background:#FAF8F7;font-size:12.5px;color:var(--mute);font-weight:600}
td.n{font-weight:600}td.t,td.ph{direction:ltr;text-align:right;color:var(--mute);font-size:13px;white-space:nowrap}
td .x{border:0;background:none;color:#c0392b;cursor:pointer;font-size:13px}
.msg{padding:30px;text-align:center;color:var(--mute)}
@media(max-width:620px){td.org,th.org{display:none}}
</style>
</head>
<body><div class="wrap">
<h1>الحضور بالرابط <b id="cnt">0</b></h1>
<p class="sub">الأسماء الي انسجلت من رابط الفورم. تتحدث كل 10 ثواني.</p>
<div class="bar"><input id="q" type="search" placeholder="ابحث بالاسم أو الرقم أو الجهة"><button class="btn" id="cp">نسخ رابط الفورم</button><button class="btn pr" id="xl">تنزيل Excel</button></div>
<div class="stats" id="st"></div>
<div id="out"><div class="msg">جاري التحميل…</div></div>
</div>
<script>
(()=>{const $=s=>document.querySelector(s);let tok=null,A=[],adm=false;try{tok=JSON.parse(localStorage.getItem('ks-token')||'null')}catch{}
const H=()=>({'Content-Type':'application/json','X-Token':tok||''});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tm=t=>{const d=new Date(t);return d.toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})};
const FORM=location.origin+location.pathname.replace(/list\.html$/,'');
async function load(){if(!tok){$('#out').innerHTML='<div class="msg">سجّل دخول للنظام أول من نفس المتصفح، وبعدين افتح هالصفحة.</div>';return}
 try{const r=await fetch('../api.php?r=att/list',{method:'POST',headers:H(),body:'{}'});const j=await r.json();
  if(!r.ok){$('#out').innerHTML=`<div class="msg">${esc(j.msg||'ما عندك صلاحية')}</div>`;return}
  A=j.att||[];draw()}catch{}}
fetch('../api.php?r=session',{headers:{'X-Token':tok||''},cache:'no-store'}).then(r=>r.json()).then(j=>{adm=!!(j.me&&j.me.role==='admin');draw()}).catch(()=>{});
function draw(){const q=$('#q').value.trim();const L=[...A].sort((a,b)=>b.t-a.t).filter(x=>!q||[x.n,x.ph,x.org].join(' ').includes(q));
 $('#cnt').textContent=A.length;const m=A.filter(x=>x.gd==='m').length;$('#st').innerHTML=`<span>رجال: ${m}</span><span>نساء: ${A.length-m}</span>`;
 if(!L.length){$('#out').innerHTML='<div class="msg">'+(A.length?'ماكو نتائج':'بعد ماكو أحد سجّل')+'</div>';return}
 $('#out').innerHTML='<table><thead><tr><th>#</th><th>الاسم</th><th></th><th>الهاتف</th><th class="org">الجهة</th><th>الوقت</th>'+(adm?'<th></th>':'')+'</tr></thead><tbody>'+L.map((x,i)=>`<tr><td>${L.length-i}</td><td class="n">${esc(x.n)}</td><td>${x.gd==='m'?'رجل':'امرأة'}</td><td class="ph">${esc(x.ph||'')}</td><td class="org">${esc(x.org||'')}</td><td class="t">${tm(x.t)}</td>${adm?`<td><button class="x" data-id="${esc(x.id)}">حذف</button></td>`:''}</tr>`).join('')+'</tbody></table>'}
$('#q').oninput=draw;
$('#out').onclick=async e=>{const b=e.target.closest('.x');if(!b)return;const x=A.find(y=>y.id===b.dataset.id);if(!x||!confirm('تحذف '+x.n+' من القائمة؟'))return;
 const r=await fetch('../api.php?r=att/delete',{method:'POST',headers:H(),body:JSON.stringify({id:x.id})});const j=await r.json();if(r.ok){A=j.att||[];draw()}else alert(j.msg||'ما انحذف')};
$('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(FORM);$('#cp').textContent='انسخ ✓'}catch{prompt('انسخ الرابط:',FORM)}setTimeout(()=>$('#cp').textContent='نسخ رابط الفورم',1800)};
$('#xl').onclick=()=>{const rows=[['#','الاسم','الجنس','الهاتف','الجهة','الوقت']].concat([...A].sort((a,b)=>a.t-b.t).map((x,i)=>[i+1,x.n,x.gd==='m'?'رجل':'امرأة',x.ph?'‎'+x.ph:'',x.org||'',tm(x.t)]));
 const csv='﻿'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='الحضور-بالرابط.csv';a.click()};
load();setInterval(load,10000);
})();
</script>
</body></html>
