<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<title>دليل المنظمين</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: تعليمات ميدانية هادئة وواضحة لفريق المنظمين
   IDEA: مجسم المبنى نفسه، مثل نظام القاعة: مقطع مفتوح للطابقين والدرج والقاعة
   PICTURE: المجسم يملي الشاشة، منظمين بأرقام بأماكنهم، وضيف يمشي على المسار لحد كرسيه
   COLOUR and TYPE: ألوان المبنى الهادئة، نبيذي العروش #5a1238 للمنظمين، ذهبي للمسار؛ IBM Plex Sans Arabic
   LAYOUT: المجسم كامل الشاشة، لوحة المحطات يمين على الحاسبة وتحت على التلفون */
:root{--wine:#5a1238;--wine2:#7b1f4d;--gold:#c9a45c;--ink:#22141b;--mute:#76646d;--line:#eadfe4;--soft:#f3e6ec}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#efe9e2;color:var(--ink);font:16px/1.6 "IBM Plex Sans Arabic",system-ui,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hd{position:fixed;top:14px;inset-inline-start:14px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-radius:16px;padding:10px 16px;box-shadow:0 6px 20px rgba(60,20,40,.12);z-index:3;max-width:min(420px,calc(100vw - 28px))}
.hd b{display:block;font-size:20px;line-height:1.2;color:var(--wine)}
.hd span{font-size:13px;color:var(--mute)}
.pn{position:fixed;z-index:3;top:14px;bottom:14px;inset-inline-end:14px;width:380px;display:flex;flex-direction:column;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-radius:20px;box-shadow:0 10px 30px rgba(60,20,40,.16);overflow:hidden}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 12px 8px;flex:none;scrollbar-width:none}
.chips button{flex:none;font:inherit;font-weight:600;font-size:14px;min-height:40px;padding:0 13px;border-radius:999px;border:0;background:var(--soft);color:var(--ink);cursor:pointer}
.chips button.on{background:var(--wine);color:#fff}
.card{flex:1;overflow-y:auto;padding:6px 18px 12px}
.num{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--wine);color:#fff;font-weight:700;font-size:18px;margin-bottom:6px}
.card h2{margin:0;font-size:22px;line-height:1.2}
.where{color:var(--mute);font-size:14px;margin:2px 0 12px}
.p{display:grid;grid-template-columns:34px minmax(0,1fr);gap:0 10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin-bottom:8px;cursor:pointer}
.p i{grid-row:span 2;width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--wine);display:grid;place-items:center;font-style:normal;font-weight:700}
.p b{font-size:15px}.p small{font-size:14px;color:var(--mute);line-height:1.45}
.say{background:var(--soft);border-radius:14px;padding:10px 14px;font-size:16px;margin-top:4px}
.say b{display:block;font-size:12px;color:var(--wine2)}
.tip{font-size:14px;color:var(--mute);margin-top:10px}.tip b{color:var(--ink)}
.intro{font-size:15px;margin:0 0 12px}
.stats{display:flex;gap:22px;margin:4px 0 12px}.stats b{display:block;font-size:26px;color:var(--wine);line-height:1}.stats span{font-size:13px;color:var(--mute)}
.ctl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:6px 0 10px}
.ctl label{display:grid;gap:2px;font-size:13px;color:var(--mute)}
select{font:inherit;font-size:16px;min-height:44px;padding:0 8px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.read{font-weight:600;font-size:16px}.read em{font-style:normal;color:#c0102a}
.rules{font-size:14px;color:var(--mute);margin-top:10px;display:grid;gap:4px}.rules b{color:var(--ink)}
.nv{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);flex:none}
.nv button,.cp{font:inherit;font-weight:700;font-size:15px;min-height:44px;border-radius:12px;border:0;cursor:pointer}
.nv button{flex:1;background:var(--soft);color:var(--ink)}
.nv #tour{background:var(--wine);color:#fff;flex:1.4}
.cp{background:var(--gold);color:var(--wine);padding:0 16px;margin-top:6px;width:100%}
.ok{font-size:13px;color:var(--mute);display:block;margin-top:4px;min-height:1em}
button:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hint{position:fixed;bottom:16px;inset-inline-start:16px;z-index:2;font-size:13px;color:var(--mute);background:rgba(255,255,255,.8);padding:4px 10px;border-radius:999px}
.load{position:fixed;inset:0;display:grid;place-items:center;z-index:5;background:#efe9e2;color:var(--wine);font-weight:700;font-size:18px;text-align:center;padding:20px}
.load[hidden]{display:none}
.ph{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;margin:2px 0 12px;background:#eee;cursor:zoom-in}
#lb{position:fixed;inset:0;z-index:9;background:rgba(12,6,9,.93);display:none;place-items:center;padding:12px;cursor:zoom-out}#lb.on{display:grid}#lb img{max-width:100%;max-height:100%;border-radius:10px}
@media(max-width:760px){
 .hd{top:10px;inset-inline-start:10px;padding:8px 12px}.hd b{font-size:17px}.hd span{font-size:12px}
 .pn{top:auto;bottom:0;inset-inline:0;width:auto;height:min(46vh,430px);border-radius:20px 20px 0 0}
 .pn.min{height:auto}.pn.min .card{display:none}
 .hint{display:none}
 .card h2{font-size:19px}
}
.grab{display:none}
@media(max-width:760px){.grab{display:block;width:44px;height:5px;border-radius:5px;background:#d8c9d0;margin:8px auto 0;border:0;padding:0;cursor:pointer}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="c" aria-label="مجسم المبنى ومسار الضيف"></canvas>

<aside class="pn" id="pn">

  <div class="card" id="card"></div>

<script type="module">

const canvas=$('#c');

renderer.setPixelRatio(Math.min(devicePixelRatio,2));

sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-21,right:21,top:33,bottom:-33,near:1,far:90});sun.shadow.bias=-.0003;sun.shadow.normalBias=.02;sun.target.position.set(0,0,-16);scene.add(sun,sun.target);

const wuv=g=>{const p=g.attributes.position,n=g.attributes.normal,uv=g.attributes.uv;for(let i=0;i<p.count;i++){const ax=Math.abs(n.getX(i)),ay=Math.abs(n.getY(i));if(ax>.5)uv.setXY(i,p.getZ(i),p.getY(i));else if(ay>.5)uv.setXY(i,p.getX(i),p.getZ(i));else uv.setXY(i,p.getX(i),p.getY(i))}return g};
const M=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.75,...o});
const tex=(w,h,draw,rx=1,ry=1)=>{const cv=document.createElement('canvas');cv.width=w;cv.height=h;draw(cv.getContext('2d'),w,h);const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=8;return t};

const flight=(x0,z0,y0,solid)=>{for(let i=0;i<12;i++){const top=y0+(i+1)*RISE,z=z0-RUN*(i+.5),bot=solid?0:Math.max(y0,top-.5);box(SW,top-.05-bot,RUN,mBlack,x0,(top-.05+bot)/2,z);box(SW+.06,.05,RUN+.05,mMarble,x0,top-.025,z+.02)}};

const capsule=body=>{const g=new THREE.Group();const b=new THREE.Mesh(new THREE.CapsuleGeometry(.22,.72,4,12),M(body,{roughness:.6}));b.position.y=.62;b.castShadow=true;const h=new THREE.Mesh(new THREE.SphereGeometry(.15,16,12),M('#d9b896'));h.position.y=1.5;h.castShadow=true;g.add(b,h);return g};
const slots=MEN.map(([st,n,x,y,z,ry])=>{const g=new THREE.Group();g.position.set(x,y,z);g.rotation.y=ry;g.userData.st=st;g.add(mkRing());scene.add(g);const s=badge(n);s.position.set(x,y+2.2,z);s.userData.st=st;scene.add(s);people.push(g,s);return g});
const guest=new THREE.Group();scene.add(guest);let gw=null;
const mBadge=M('#c9a45c',{roughness:.4,metalness:.3}),mBadgeR=M('#d0021b',{roughness:.5});
const fallback=()=>{for(const g of slots)g.add(capsule('#3a1a2a'));guest.add(capsule('#f2ede4'))};
import('./m/person.js').then(m=>{const bs=atob(m.default),u=new Uint8Array(bs.length);for(let i=0;i<bs.length;i++)u[i]=bs.charCodeAt(i);new GLTFLoader().parse(u.buffer,'',gl=>{
 const src=gl.scene;src.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;o.frustumCulled=false;if(/Headwear/.test(o.name))o.visible=false}});
 src.updateMatrixWorld(true);
 const B=n=>src.getObjectByName(n),V=()=>new THREE.Vector3(),Q=()=>new THREE.Quaternion();
 const aim=(a,b,dir)=>{const A=B(a),C=B(b);if(!A||!C)return;src.updateMatrixWorld(true);const cur=C.getWorldPosition(V()).sub(A.getWorldPosition(V())).normalize();const q=Q().setFromUnitVectors(cur,dir.normalize());const pq=A.parent.getWorldQuaternion(Q()),aq=A.getWorldQuaternion(Q());A.quaternion.copy(pq.invert().multiply(q).multiply(aq));src.updateMatrixWorld(true)};
 aim('LeftArm','LeftForeArm',new THREE.Vector3(.16,-1,.02));aim('RightArm','RightForeArm',new THREE.Vector3(-.16,-1,.02));
 aim('LeftForeArm','LeftHand',new THREE.Vector3(.06,-1,.32));aim('RightForeArm','RightHand',new THREE.Vector3(-.06,-1,.32));
 const suit=u=>{const t=TL.load(u);t.flipY=false;t.colorSpace=THREE.SRGBColorSpace;return t};
 const tint=(root,top,bot)=>root.traverse(o=>{if(o.isMesh&&/Outfit_(Top|Bottom)/.test(o.name)){o.material=o.material.clone();if(/Top/.test(o.name))o.material.map=top;else o.material.color.set(bot)}});
 const sOrg=suit('t/suit_org.jpg'),sGst=suit('t/suit_guest.jpg');
 let hair=null;{const hm=B('Wolf3D_Head'),hb=B('Head');if(hm&&hb){src.updateMatrixWorld(true);hm.geometry.computeBoundingBox();const bb=hm.geometry.boundingBox.clone().applyMatrix4(hm.matrixWorld),sz=bb.getSize(V()),c=bb.getCenter(V());c.y=bb.min.y+sz.y*.6;c.z-=sz.z*.07;const top=bb.max.y;hair={p:c.clone().applyMatrix4(hb.matrixWorld.clone().invert()),s:new THREE.Vector3(sz.x*.53,(top-c.y)*1.1,sz.z*.55)}}}
 const box3=new THREE.Box3().setFromObject(src),H=box3.max.y-box3.min.y,k=1.76/H;src.scale.setScalar(k);
 const mHair=M('#1c1714',{roughness:.85});
 const dress=(root,mat)=>{const hd=root.getObjectByName('Head');if(hd&&hair){const h=new THREE.Mesh(new THREE.SphereGeometry(1,28,14,0,Math.PI*2,0,Math.PI*.5),mHair);h.scale.copy(hair.s);h.position.copy(hair.p);h.rotation.x=-.42;h.castShadow=true;hd.add(h)}const sp=root.getObjectByName('Spine2');if(sp){const bd=new THREE.Mesh(new THREE.BoxGeometry(.085,.11,.008),mat);bd.position.set(.1,.02,.13);sp.add(bd)}};
 for(const g of slots){const c=SkeletonUtils.clone(src);tint(c,sOrg,'#2c2c31');dress(c,mBadge);g.add(c)}
 const gc=SkeletonUtils.clone(src);tint(gc,sGst,'#55585e');dress(gc,mBadgeR);guest.add(gc);
 const gB=n=>gc.getObjectByName(n);
 gw=['LeftUpLeg','RightUpLeg','LeftLeg','RightLeg','LeftArm','RightArm'].map(n=>{const b=gB(n);return b?{b,q:b.quaternion.clone()}:null});
},fallback)}).catch(fallback);

/* ---------- المسار ---------- */
let path=[],segs=[],total=0;const dots=new THREE.InstancedMesh(new THREE.CircleGeometry(.1,12),new THREE.MeshBasicMaterial({color:'#c9a45c'}),400);dots.renderOrder=2;scene.add(dots);
const seatSel={r:5,c:21};
const buildPath=()=>{const {r,c}=seatSel,sx=seatX(c),sy=rowY(r),sz=rowZ(r)+.55;const ais=[-10.6,-3.5,3.5,10.6].reduce((a,b)=>Math.abs(b-sx)<Math.abs(a-sx)?b:a);
 path=[[8.7,0,12.6],[8.7,0,7.3],[3.4,0,8.7],[.6,0,8.4],[0,0,7.6],[0,0,7],[0,2.25,1],[0,2.25,-2.6],[1.9,2.25,-4.5],[4,2.25,-4.5],[10,4.5,-4.5],[12.6,4.5,-4.5],[12.6,4.5,-12],[9.8,4.5,-20],[7.2,4.5,-23.6],[7.2,4.5,-27.4],[ais,4.5,-28.4],[ais,sy,sz],[sx,sy,sz]].map(p=>new THREE.Vector3(...p));
 segs=[];total=0;for(let i=1;i<path.length;i++){const L=path[i].distanceTo(path[i-1]);segs.push(L);total+=L}
 const o=new THREE.Object3D();o.rotation.x=-Math.PI/2;let n=0;for(let d=.3;d<total&&n<400;d+=.55){o.position.copy(at(d));o.position.y+=.06;o.updateMatrix();dots.setMatrixAt(n++,o.matrix)}dots.count=n;dots.instanceMatrix.needsUpdate=true;
 pick.position.set(sx,sy,rowZ(r));walk=0};
const at=d=>{for(let i=0;i<segs.length;i++){if(d<=segs[i])return path[i].clone().lerp(path[i+1],d/segs[i]);d-=segs[i]}return path[path.length-1].clone()};
let walk=0;

/* ---------- الكاميرا ---------- */
let fly=null;const ease=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const flyTo=(p,t,d=1400)=>{const T=new THREE.Vector3(...t),P=new THREE.Vector3(...p);if(innerWidth<760)P.sub(T).multiplyScalar(innerWidth<480?1.75:1.35).add(T);fly={p0:camera.position.clone(),t0:controls.target.clone(),p1:P,t1:T,s:performance.now(),d}};
const seatCam=()=>{const x=seatX(seatSel.c),z=rowZ(seatSel.r);return [[x*.5,20,-17.5],[x*.6,4.8,z-2.5]]};
let tourT=null;const stopTour=()=>{if(tourT){clearInterval(tourT);tourT=null;$('#tour').textContent='جولة تلقائية'}};
controls.addEventListener('start',()=>{fly=null;stopTour()});

/* ---------- اللوحة ---------- */
let cur=0;const ORD=['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر','الحادي عشر'];
$('#chips').innerHTML=ST.map((s,i)=>`<button data-i="${i}">${i?i+' ':''}${['المسار','الاستقبال','أسفل الدرج','الساحة','رأس الدرج','باب القاعة','الكرسي'][i]}</button>`).join('');
const readSeat=()=>{const {r,c}=seatSel,b='ABC'[Math.floor((c-1)/10)],n=(c-1)%10+1;return `صف ${r} – كرسي ${b}${n}: <em>الصف ${ORD[r-1]} من المسرح${r<=2?' (VIP)':''}</em>، قسم ${b} ${({A:'على يمينك',B:'بالنص',C:'على يسارك'})[b]} وانت مواجه المسرح، و${n==1?'أول كرسي من يمين القسم':'الكرسي '+n+' تعد من يمين القسم'}.`};
const msg=()=>'توزيع منظمين مؤتمر السيدة خديجة الكبرى (ع)\n\n'+ST.slice(1,6).map((s,i)=>`${i+1}) ${s.t} (${s.w}):\n`+s.ppl.map(p=>`- منظم ${p[0]}: ${p[1]}`).join('\n')).join('\n\n')+'\n\nالكراسي: الصف 1 يم المسرح. وانت مواجه المسرح A يمين، B نص، C يسار. كل قسم من 1 لحد 10، والكرسي 1 على يمين القسم.';
const show=(i,move=true)=>{cur=i;const s=ST[i];document.querySelectorAll('#chips button').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));
 $('#chips button.on').scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
 let h=`<span class="num">${i||'★'}</span><h2>${s.t}</h2><p class="where">${s.w}${s.ppl?`، ${s.ppl.length} ${s.ppl.length>2?'منظمين':s.ppl.length==2?'منظمَين':'منظم'}`:''}</p>`+(s.img?`<img class="ph" src="${s.img}" alt="صورة واقعية: ${s.t}" loading="lazy">`:'');
 if(i===0)h+=`<div class="stats"><div><b>9</b><span>منظمين</span></div><div><b>5</b><span>نقاط وقوف</span></div><div><b>330</b><span>كرسي</span></div></div><p class="intro">الخط الذهبي هو طريق الضيف، والضيف الأبيض يمشي عليه من المدخل لحد كرسيه. اضغط على أي منظم بالمجسم أو على رقم فوك حتى تشوف مكانه وشغله.</p><button class="cp" id="copy">انسخ التوزيع كرسالة واتساب</button><span class="ok" id="ok"></span>`;
 if(s.ppl)h+=s.ppl.map(p=>`<div class="p" data-st="${i}"><i>${p[0]}</i><b>منظم ${p[0]}</b><small>${p[1]}</small></div>`).join('')+`<div class="say"><b>شنو يكول للضيف</b>«${s.say}»</div>${s.tip?`<p class="tip">${s.tip}</p>`:''}`;
 if(s.seat)h+=`<div class="ctl"><label>الصف<select id="sr">${Array.from({length:11},(_,k)=>`<option ${k+1==seatSel.r?'selected':''}>${k+1}</option>`).join('')}</select></label><label>القسم<select id="sb">${['A','B','C'].map(b=>`<option ${b=='ABC'[Math.floor((seatSel.c-1)/10)]?'selected':''}>${b}</option>`).join('')}</select></label><label>الكرسي<select id="sn">${Array.from({length:10},(_,k)=>`<option ${k+1==(seatSel.c-1)%10+1?'selected':''}>${k+1}</option>`).join('')}</select></label></div><p class="read" id="rd">${readSeat()}</p><div class="rules"><div><b>الصف:</b> من 1 لحد 11، الصف 1 يم المسرح، والصفين 1 و 2 للـ VIP.</div><div><b>القسم:</b> وانت مواجه المسرح A يمينك، B بالنص، C يسارك.</div><div><b>الكرسي:</b> كل قسم من 1 لحد 10، والكرسي 1 على يمين القسم.</div></div>`;
 $('#card').innerHTML=h;$('#card').scrollTop=0;
 if(i===0)$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(msg());$('#ok').textContent='انتسخت، الصقها بالواتساب'}catch(e){$('#ok').textContent='ما انتسخت بهذا المتصفح'}};
 if(s.seat){const upd=()=>{seatSel.r=+$('#sr').value;seatSel.c=('ABC'.indexOf($('#sb').value))*10+ +$('#sn').value;$('#rd').innerHTML=readSeat();buildPath();const [p,t]=seatCam();flyTo(p,t,1000)};['#sr','#sb','#sn'].forEach(q=>$(q).onchange=upd)}
 if(move){const [p,t]=s.seat?seatCam():[s.cam,s.tg];flyTo(p,t)}};
$('#chips').onclick=e=>{const b=e.target.closest('button');if(b){stopTour();show(+b.dataset.i)}};
$('#card').addEventListener('click',e=>{const im=e.target.closest('.ph');if(im){$('#lb img').src=im.src;$('#lb').classList.add('on');return}const p=e.target.closest('.p');if(p)show(+p.dataset.st)});
$('#lb').onclick=()=>$('#lb').classList.remove('on');addEventListener('keydown',e=>{if(e.key==='Escape')$('#lb').classList.remove('on')});
$('#next').onclick=()=>{stopTour();show((cur+1)%ST.length)};$('#prev').onclick=()=>{stopTour();show((cur+ST.length-1)%ST.length)};
$('#tour').onclick=()=>{if(tourT){stopTour();return}$('#tour').textContent='وقّف الجولة';show((cur+1)%ST.length);tourT=setInterval(()=>show((cur+1)%ST.length),6500)};
$('#grab').onclick=()=>$('#pn').classList.toggle('min');

/* ---------- الضغط على منظم ---------- */
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();let down=null;
canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY}});
canvas.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down.x,e.clientY-down.y)>6){down=null;return}down=null;const r=canvas.getBoundingClientRect();mv.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mv,camera);
 const hit=ray.intersectObjects(people,true)[0];if(hit){let o=hit.object;while(o&&o.userData.st==null)o=o.parent;if(o){stopTour();show(o.userData.st)}}});

/* ---------- التشغيل ---------- */
const resize=()=>{const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<760?55:42;camera.updateProjectionMatrix();
 const side=w>=760?394:0,bot=w<760?Math.min(h*.46,430):0;camera.setViewOffset(w+side,h+bot,0,bot,w,h)};
addEventListener('resize',resize);resize();
camera.position.set(40,34,30);controls.target.set(2,2,-12);buildPath();show(0);
const RED=matchMedia('(prefers-reduced-motion: reduce)').matches;
let last=performance.now();const _q=new THREE.Quaternion(),_x=new THREE.Vector3(1,0,0);
renderer.setAnimationLoop(now=>{const dt=Math.min(.05,(now-last)/1000);last=now;
 if(fly){const k=Math.min(1,(now-fly.s)/fly.d),e=ease(k);camera.position.lerpVectors(fly.p0,fly.p1,e);controls.target.lerpVectors(fly.t0,fly.t1,e);if(k>=1)fly=null}
 controls.update();
 if(!RED){walk+=dt*1.6;if(walk>total+2.2)walk=0}else walk=total;
 const d=Math.min(walk,total),p=at(d),q=at(Math.min(d+.3,total));guest.position.copy(p);if(q.distanceToSquared(p)>1e-4)guest.rotation.y=Math.atan2(q.x-p.x,q.z-p.z);
 if(gw){const mv=walk<total&&!RED,ph=now/230,sn=mv?Math.sin(ph):0;const sw=(i,ang)=>{const e=gw[i];if(e)e.b.quaternion.copy(e.q).multiply(_q.setFromAxisAngle(_x,ang))};sw(0,.4*sn);sw(1,-.4*sn);sw(2,-Math.max(0,-sn)*.6);sw(3,-Math.max(0,sn)*.6);sw(4,.22*sn);sw(5,-.22*sn)}
 const s=1+.15*Math.sin(now/300);for(const r of rings)r.scale.setScalar(s);beam.material.opacity=.3+.2*Math.sin(now/250);
 renderer.render(scene,camera)});
$('#load').hidden=true;
}
</script>
</body>
